<!doctype html>
<meta charset="utf-8">
<style>
  body { width: 380px; margin: 0; padding: 16px; font: 14px/1.45 -apple-system, system-ui, sans-serif; background: #F4F2EC; color: #111; }
  h1 { font-size: 16px; margin: 0 0 12px; display: flex; gap: 8px; align-items: center; }
  .mark { width: 22px; height: 22px; background: #111; border-radius: 5px; position: relative; }
  .mark i { position: absolute; top: 5px; width: 4px; height: 12px; background: #fff; border-radius: 1px; }
  .mark i + i { opacity: .55; top: 7px; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; }
  select, input, button { font: inherit; padding: 7px 9px; border: 1px solid #c9c5ba; border-radius: 6px; background: #fff; }
  input { flex: 1; min-width: 0; }
  button { background: #111; color: #fff; border-color: #111; cursor: pointer; width: 100%; }
  button:disabled { opacity: .5; cursor: wait; }
  #status { color: #666; margin: 10px 0; }
  .claim { background: #fff; border: 1px solid #e0dccf; border-radius: 8px; padding: 10px; margin-top: 8px; }
  .tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; margin-bottom: 4px; }
  .confirmed { background: #dcefdc; } .contested { background: #f6d9d3; }
  .single_source { background: #f3e6b8; } .no_coverage { background: #e4e2dc; }
  .why { color: #444; font-size: 13px; margin-top: 4px; }
  .note { margin: 10px 0; padding: 10px; border-left: 3px solid #111; background: #fff; font-size: 13px; }
  .rtl { direction: rtl; text-align: right; }
  .lbl { font-size: 12px; color: #666; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
  .langs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .langs button { width: auto; flex: 1; background: #fff; color: #111; border-color: #c9c5ba; padding: 6px 8px; }
  .langs button:hover { border-color: #111; }
  .main { padding: 10px; font-weight: 600; }
  .score { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; font-weight: 600; }
  .bar { flex: 1; height: 8px; background: #e4e1d8; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #111; }
  .saved { font-size: 13px; color: #2d6a2d; margin-top: 12px; }
  .saved a { color: inherit; }
  ul { padding-left: 18px; margin: 8px 0; }
</style>
<h1><img src="icons/48.png" width="22" height="22" alt="">Parallax</h1>
<div class="lbl">Summarize this article in</div>
<div class="langs" id="langs">
  <button data-l="English">English</button><button data-l="Arabic">العربية</button><button data-l="Chinese">中文</button>
  <button data-l="French">Français</button><button data-l="Spanish">Español</button>
</div>
<button id="check" class="main">Save to Parallax</button>
<details id="settings" style="margin:10px 0;font-size:13px"><summary style="cursor:pointer;color:#666">Settings</summary>
  <div class="row" style="margin-top:8px"><input id="key" type="password" placeholder="Gemini API key (saved locally)"></div>
  <div class="row"><input id="dash" placeholder="Parallax dashboard URL"></div>
  <div class="row"><input id="server" placeholder="Evidence server URL (optional)"></div>
  <button id="saveSettings">Save settings</button>
</details>
<div id="status"></div>
<div id="out"></div>
<script src="analyze.js"></script>
<script src="popup.js"></script>
