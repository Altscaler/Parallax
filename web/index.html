<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Parallax</title>
<link rel="icon" href="logo.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#F4F2EC; --ink:#111; --muted:#6b6862; --line:#e4e1d8; --card:#fff; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Inter, system-ui, sans-serif; background:var(--bg); color:var(--ink); display:flex; min-height:100vh; }
  a { color:inherit; }
  aside { width:248px; flex-shrink:0; background:#111; color:#fff; padding:24px 18px; display:flex; flex-direction:column; gap:24px; position:sticky; top:0; height:100vh; overflow-y:auto; }
  .brand { display:flex; align-items:center; gap:10px; font-weight:600; font-size:22px; letter-spacing:-0.03em; cursor:pointer; }
  .sec h4 { margin:0 0 10px; font-size:11px; font-weight:500; text-transform:uppercase; letter-spacing:.12em; color:#8a8780; }
  .nav a { display:flex; justify-content:space-between; padding:8px 10px; border-radius:8px; color:#d8d6d0; text-decoration:none; font-size:14px; cursor:pointer; }
  .nav a.on { background:#262626; color:#fff; }
  .nav a span { color:#8a8780; font-size:12px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; padding:5px 9px; border-radius:999px; border:1px solid #3a3a3a; color:#d8d6d0; cursor:pointer; user-select:none; background:none; font-family:inherit; }
  .chip.on { background:#fff; color:#111; border-color:#fff; }
  .seg { display:flex; border:1px solid #3a3a3a; border-radius:8px; overflow:hidden; }
  .seg button { flex:1; text-align:center; font-size:12px; padding:6px 0; color:#d8d6d0; background:none; border:0; cursor:pointer; font-family:inherit; }
  .seg button.on { background:#fff; color:#111; }
  .picker .seg button.on { background:#111; color:#fff !important; }
  select.dark { width:100%; background:#1c1c1c; color:#fff; border:1px solid #3a3a3a; border-radius:8px; padding:7px; font:inherit; font-size:13px; }
  .foot { margin-top:auto; font-size:12px; color:#8a8780; line-height:1.6; }
  .foot a { color:#d8d6d0; cursor:pointer; }
  main { flex:1; padding:28px 32px 48px; min-width:0; }
  header.top { display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:22px; gap:16px; flex-wrap:wrap; }
  h1 { margin:0; font-size:26px; letter-spacing:-0.02em; line-height:1.25; }
  .sub { color:var(--muted); font-size:14px; margin-top:4px; }
  .search { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px 14px; width:340px; max-width:100%; font:inherit; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(290px,1fr)); gap:16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:12px; cursor:pointer; transition:border-color .15s; }
  .card:hover { border-color:#111; }
  .tag { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.1em; }
  .card h3 { margin:0; font-size:17px; line-height:1.3; letter-spacing:-0.01em; }
  .flags { display:flex; gap:6px; flex-wrap:wrap; }
  .flags span { font-size:12px; background:var(--bg); border-radius:6px; padding:3px 7px; }
  .meter { display:flex; align-items:center; gap:10px; font-size:12px; color:var(--muted); }
  .bar { flex:1; height:6px; background:var(--bg); border-radius:3px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#111; }
  .why { font-size:12px; color:var(--muted); }
  .cardfoot { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:13px; color:var(--muted); margin-top:auto; }
  .cardfoot .fl { font-size:16px; letter-spacing:2px; }
  .crumb { font-size:13px; color:var(--muted); cursor:pointer; }
  .picker { display:flex; align-items:center; gap:10px; font-size:14px; flex-wrap:wrap; margin:16px 0; }
  .picker select { background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; font:inherit; font-weight:500; }
  .box { background:#fff; border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; }
  .box h2 { margin:0 0 12px; font-size:12px; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); font-weight:500; }
  .box ul { margin:0; padding-left:20px; }
  .box li { margin:6px 0; font-size:15px; line-height:1.45; }
  small, .src { color:var(--muted); font-size:12px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
  .cols .box { margin:0; }
  .side h3 { margin:0 0 12px; font-size:18px; }
  .hl { border-left:3px solid #111; padding:2px 0 2px 12px; margin:0 0 12px; }
  .hl .o { font-size:15px; font-weight:500; line-height:1.4; }
  .hl .o a { text-decoration:none; }
  .hl .o a:hover { text-decoration:underline; }
  .hl .t { font-size:13px; color:var(--muted); margin-top:3px; }
  .hl .s { font-size:12px; color:var(--muted); margin-top:3px; }
  .lean { display:inline-block; font-size:11px; border:1px solid var(--line); border-radius:4px; padding:0 5px; margin-left:4px; }
  .read { margin-top:14px; padding-top:12px; border-top:1px solid var(--line); font-size:14px; line-height:1.5; }
  .words { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .words span { font-size:12px; background:var(--bg); border-radius:6px; padding:3px 8px; }
  .gemma { background:#111; color:#fff; border-color:#111; }
  .gemma h2 { color:#8a8780; }
  .gemma p { margin:0 0 14px; font-size:15px; line-height:1.6; max-width:900px; white-space:pre-wrap; }
  .gemma .rtl { direction:rtl; text-align:right; }
  .listen { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  .listen button { font:inherit; font-size:12px; padding:6px 11px; border-radius:999px; border:1px solid #3a3a3a; background:none; color:#fff; cursor:pointer; }
  .listen button.on { background:#fff; color:#111; }
  .listen .note { font-size:12px; color:#8a8780; margin-left:6px; }
  .claim { display:flex; gap:12px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--line); }
  .claim:first-of-type { border-top:0; }
  .st { flex-shrink:0; font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; white-space:nowrap; }
  .confirmed { background:#dcefdc; } .contested { background:#f6d9d3; } .single_source { background:#f3e6b8; } .no_coverage { background:#e4e2dc; }
  .claim .c { font-size:15px; } .claim .w { font-size:13px; color:var(--muted); margin-top:2px; }
  .cov { display:flex; flex-direction:column; gap:6px; }
  .cov div { display:flex; align-items:center; gap:10px; font-size:13px; }
  .cov b { width:150px; font-weight:500; }
  .cov .bar { max-width:360px; }
  textarea, input.txt { width:100%; font:inherit; font-size:15px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; background:#fff; }
  textarea { min-height:130px; resize:vertical; }
  .btn { background:#111; color:#fff; border:0; border-radius:10px; padding:11px 18px; font:inherit; font-weight:500; cursor:pointer; }
  .btn:disabled { opacity:.5; cursor:wait; }
  .row { display:flex; gap:10px; margin:10px 0; align-items:center; flex-wrap:wrap; }
  .row select { background:#fff; border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; }
  .muted { color:var(--muted); }
  .prose p { font-size:15px; line-height:1.6; max-width:760px; }
  .save { background:none; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; font-size:13px; cursor:pointer; }
  .empty { color:var(--muted); font-size:14px; padding:20px 0; }
  @media (max-width:860px){ body{flex-direction:column;} aside{width:auto; height:auto; position:static;} main{padding:20px 16px;} .cols{grid-template-columns:1fr;} }
</style>
</head>
<body>
<aside>
  <div class="brand" data-go="home">
    <svg width="26" height="28" viewBox="0 0 40 44"><rect x="6" y="0" width="10" height="36" rx="2" fill="#fff"/><rect x="24" y="8" width="10" height="36" rx="2" fill="#fff" opacity=".5"/></svg>
    Parallax
  </div>
  <div class="sec nav" id="nav">
    <a data-go="home">This week's stories <span id="nStories"></span></a>
    <a data-go="check">Check a claim</a>
    <a data-go="saved">Saved <span id="nSaved"></span></a>
    <a data-go="method">How we stay neutral</a>
  </div>
  <div class="sec"><h4>Countries</h4><div class="chips" id="fCountries"></div></div>
  <div class="sec"><h4>Political camp</h4><div class="seg" id="fCamp">
    <button data-v="left">Left</button><button data-v="all" class="on">All</button><button data-v="right">Right</button></div></div>
  <div class="sec"><h4>Topics</h4><div class="chips" id="fTopics"></div></div>
  <div class="sec"><h4>Listen in</h4><div class="chips" id="fLang"></div></div>
  <div class="foot"><span id="meta"></span><br>Explained by Gemma 4 (26B)<br>Grouped by EmbeddingGemma<br>Voice by ElevenLabs</div>
</aside>
<main id="main"></main>

<script>
const FLAG = { FR:"🇫🇷", ES:"🇪🇸", US:"🇺🇸", GB:"🇬🇧", CN:"🇨🇳", AE:"🇦🇪", QA:"🇶🇦", SA:"🇸🇦", DE:"🇩🇪", SG:"🇸🇬", RU:"🇷🇺", IN:"🇮🇳", INT:"🌐" };
const CNAME = { FR:"France", ES:"Spain", US:"USA", GB:"UK", CN:"China-based media", AE:"UAE", QA:"Qatar", SA:"Saudi Arabia", DE:"Germany", SG:"Singapore", RU:"Russia", IN:"India", INT:"International" };
const LANGS = [["ar","العربية"],["zh","中文"],["en","English"],["fr","Français"],["es","Español"]];
const SPEECH = { en:"en-US", fr:"fr-FR", es:"es-ES", zh:"zh-CN", ar:"ar-SA" };
const STATUS = { confirmed:"Confirmed", contested:"Contested", single_source:"Single source", no_coverage:"No coverage found" };
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} } };

let STORIES = [];
const state = { countries: new Set(), camp: "all", topic: "All", lang: store.get("lang", "en"), voice: "elevenlabs",
                saved: new Set(store.get("saved", [])), view: "home", story: null, a: null, b: null, c: null, mode: "country", q: "" };

function chips(el, items, isOn, onClick) {
  el.innerHTML = items.map(([v, label]) => `<button class="chip ${isOn(v) ? "on" : ""}" data-v="${esc(v)}">${label}</button>`).join("");
  el.querySelectorAll("button").forEach(b => b.onclick = () => onClick(b.dataset.v));
}

function renderSidebar() {
  const allC = [...new Set(STORIES.flatMap(s => s.countries))];
  chips(fCountries, allC.map(c => [c, `${FLAG[c] || ""} ${esc(CNAME[c] || c)}`]), c => state.countries.has(c),
    c => { state.countries.has(c) ? state.countries.delete(c) : state.countries.add(c); render(); });
  const topics = ["All", ...new Set(STORIES.map(s => s.topic))];
  chips(fTopics, topics.map(t => [t, esc(t)]), t => state.topic === t, t => { state.topic = t; render(); });
  chips(fLang, LANGS, l => state.lang === l, l => { state.lang = l; store.set("lang", l); render(); });
  fCamp.querySelectorAll("button").forEach(b => { b.classList.toggle("on", b.dataset.v === state.camp); b.onclick = () => { state.camp = b.dataset.v; render(); }; });
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.go === state.view || (state.view === "story" && a.dataset.go === "home")));
  nStories.textContent = STORIES.length; nSaved.textContent = (state.saved.size + store.get("articles", []).length) || "";
}

function visibleStories(list) {
  return list.filter(s => (state.topic === "All" || s.topic === state.topic)
    && [...state.countries].every(c => s.countries.includes(c))
    && (state.hits ? state.hits.includes(s.id) : (!state.q || (s.title + " " + s.headlines.map(h => h.title + " " + (h.translation || "")).join(" ")).toLowerCase().includes(state.q.toLowerCase()))));
}

function whyLine(s) {
  const n = s.countries.length;
  return `Covered in ${Object.keys(s.by_country).length} countries by ${s.n_outlets} outlets${s.wires.length ? ", including " + s.wires.join(", ") : ""}`;
}

function cardHTML(s) {
  const d = s.divergence ?? 50, lvl = d >= 70 ? "Told very differently" : d >= 40 ? "Told differently" : "Told much the same";
  return `<div class="card" data-id="${s.id}">
    <span class="tag">${esc(s.topic)}</span>
    <h3>${esc(s.title)}</h3>
    <div class="cardfoot" title="Gemma's estimate of how differently the countries tell the story">
      <span class="fl">${s.countries.map(c => FLAG[c] || c).join(" ")}</span><span>${lvl}</span></div>
  </div>`;
}

function home(list, title, sub) {
  let vis = visibleStories(list);
  if (state.hits) vis.sort((a, b) => state.hits.indexOf(a.id) - state.hits.indexOf(b.id));
  main.innerHTML = `<header class="top"><div><h1>${title}</h1><div class="sub">${sub}</div></div>
    <input class="search" id="q" placeholder="Search a story, press Enter to ask Gemma" value="${esc(state.q)}"></header>
    <div class="sub" id="qstat" style="margin:-8px 0 10px"></div>
    <div class="grid">${vis.map(cardHTML).join("") || `<div class="empty">No story matches these filters.</div>`}</div>`;
  q.onkeydown = async e => {
    if (e.key !== "Enter" || !q.value.trim()) return;
    qstat.textContent = "Gemma is searching…";
    try {
      const r = await fetch("/api/search", { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ query: q.value, stories: STORIES.map(s => ({ id: s.id, topic: s.topic, title: s.title })) }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      state.q = q.value; state.hits = d.ids; render();
      document.getElementById("qstat").textContent = "Picked by Gemma 4";
      const n = document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length);
    } catch (err) { qstat.textContent = "Gemma search failed (" + err.message + "), showing text matches."; }
  };
  q.oninput = () => { state.q = q.value; state.hits = null; const pos = q.selectionStart; render(); const n = document.getElementById("q"); n.focus(); n.setSelectionRange(pos, pos); };
  main.querySelectorAll(".card").forEach(c => c.onclick = () => open(c.dataset.id));
}

function open(id) {
  const s = STORIES.find(x => x.id === id);
  state.view = "story"; state.story = id;
  const pref = [...state.countries].filter(c => s.countries.includes(c));
  state.a = pref[0] || s.countries[0]; state.b = pref[1] || (s.countries.includes("CN") && state.a !== "CN" ? "CN" : s.countries.find(c => c !== state.a));
  render(); window.scrollTo(0, 0);
}

function headlinesFor(s, c) {
  return s.headlines.filter(h => h.country === c && (state.camp === "all" || h.leaning === state.camp || (state.camp !== "all" && !h.leaning && false)));
}

function campCols(s, c) {
  const have = ["left", "center", "right"].filter(k => s.headlines.some(h => h.country === c && h.leaning === k));
  return have.length === 2 ? have : have.includes("left") && have.includes("right") ? ["left", "right"] : [];
}

function campHTML(s, c, k) {
  const hs = s.headlines.filter(h => h.country === c && h.leaning === k);
  return `<div class="box side"><h3>${FLAG[c] || ""} ${esc(CNAME[c] || c)}: ${k}-leaning outlets</h3>${hs.map(h => `<div class="hl"><div class="o"><a href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.title)}</a></div>
      ${h.translation && h.lang !== "en-US" && h.lang !== "en-GB" ? `<div class="t">${esc(h.translation)}</div>` : ""}
      <div class="s">${esc(h.outlet)}</div></div>`).join("")}</div>`;
}

function campView(s) {
  const [x, y] = campCols(s, state.c), side = (s.sides || {})[state.c] || {};
  return `<div class="cols">${campHTML(s, state.c, x)}${campHTML(s, state.c, y)}</div>
    <div class="box"><h2>Gemma's reading of ${esc(CNAME[state.c] || state.c)} overall</h2>${esc(side.reading || "")}
      <div class="src" style="margin-top:8px">Gemma reads each country as a whole, not each camp. Camps come from public ratings (AllSides, Media Bias Fact Check) and only appear where an outlet is rated.</div></div>`;
}

function sideHTML(s, c) {
  const side = (s.sides || {})[c] || {};
  const hs = headlinesFor(s, c);
  const campNote = state.camp !== "all" && !hs.length ? `<div class="empty">No ${state.camp}-leaning outlet rated for this country. Ratings exist mainly for the US, UK, France and Spain.</div>` : "";
  return `<div class="box side"><h3>${FLAG[c] || ""} ${esc(CNAME[c] || c)}</h3>${campNote}
    ${hs.map((h, n) => `<div class="hl" ${n >= 3 ? 'data-more hidden' : ""}><div class="o"><a href="${esc(h.link)}" target="_blank" rel="noopener">${esc(h.title)}</a></div>
      ${h.translation && h.lang !== "en-US" && h.lang !== "en-GB" ? `<div class="t">${esc(h.translation)}</div>` : ""}
      <div class="s">${esc(h.outlet)}${h.leaning ? `<span class="lean">${esc(h.leaning)}</span>` : ""}${h.ownership && h.ownership !== "Not profiled yet" ? ` · ${esc(h.ownership)}` : ""}</div></div>`).join("")}
    ${hs.length > 3 ? `<button class="save" data-showmore>Show ${hs.length - 3} more headlines</button>` : ""}
    <div class="read"><b>Gemma's reading:</b> ${esc(side.reading || "No reading for this side.")}
      ${side.leaves_out ? `<div class="muted" style="margin-top:6px">Leaves out: ${esc(side.leaves_out)}</div>` : ""}
      <div class="words">${(side.loaded_words || []).map(w => `<span>${esc(w)}</span>`).join("")}</div></div></div>`;
}

function story() {
  const s = STORIES.find(x => x.id === state.story);
  const opts = sel => s.countries.map(c => `<option value="${c}" ${c === sel ? "selected" : ""}>${FLAG[c] || ""} ${esc(CNAME[c] || c)}</option>`).join("");
  const brief = (s.briefing || {})[state.lang] || (s.briefing || {}).en || "";
  const campC = s.countries.filter(c => campCols(s, c).length);
  if (state.mode === "camp" && !campC.length) state.mode = "country";
  if (!campC.includes(state.c)) state.c = campC[0];
  const maxC = Math.max(...Object.values(s.by_country));
  main.innerHTML = `
    <div class="crumb" data-go="home">This week's stories › ${esc(s.topic)} · ${s.countries.length} countries · ${s.headlines.length} headlines compared</div>
    <div style="display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-top:4px">
      <h1>${esc(s.title)}</h1>
      <button class="save" id="saveBtn">${state.saved.has(s.id) ? "Saved ✓" : "Save"}</button></div>
    <div class="why" style="margin-top:6px">${esc(whyLine(s))}</div>
    <div class="picker"><div class="seg" id="modeSeg" style="width:270px;border-color:var(--line)"><button style="color:var(--ink)" data-m="country" class="${state.mode === "country" ? "on" : ""}">Country vs country</button><button style="color:var(--ink)" data-m="camp" class="${state.mode === "camp" ? "on" : ""}">Left vs right</button></div>
      ${state.mode === "camp"
        ? `Inside <select id="selC">${campC.map(c => `<option value="${c}" ${c === state.c ? "selected" : ""}>${FLAG[c] || ""} ${esc(CNAME[c] || c)}</option>`).join("")}</select>`
        : `Compare <select id="selA">${opts(state.a)}</select> with <select id="selB">${opts(state.b)}</select>`}</div>

    <div class="box"><h2>What everyone agrees on</h2><ul>
      ${(s.common_ground || []).map(f => { const src = f.sources || []; return `<li>${esc(f.fact)} <small>${esc(src.slice(0, 4).join(", "))}${src.length > 4 ? ` +${src.length - 4} more` : ""}</small></li>`; }).join("")}</ul></div>

    ${state.mode === "camp" ? campView(s) : `<div class="cols">${sideHTML(s, state.a)}${sideHTML(s, state.b)}</div>`}

    <div class="box gemma"><h2>Gemma explains the whole story, live</h2>
      <div class="listen" style="margin-bottom:14px">
        <button data-len="short" class="${state.len === "short" ? "on" : ""}">Short</button>
        <button data-len="long" class="${state.len !== "short" ? "on" : ""}">Long</button>
        <label class="note" style="display:flex;align-items:center;gap:6px;cursor:pointer;color:#fff"><input type="checkbox" id="cmp" ${state.cmp ? "checked" : ""}> Compare both (${esc(CNAME[state.a] || state.a)} / ${esc(CNAME[state.b] || state.b)})</label>
        <span class="note">Choose a language: Gemma 4 writes it now and reads it aloud.</span></div>
      <p id="live" class="${state.lang === "ar" ? "rtl" : ""}" style="min-height:24px"></p>
      <div class="listen">${LANGS.map(([l, n]) => `<button data-l="${l}">▶ ${n}</button>`).join("")}
        <button data-stop="1">■ Stop</button><span class="note" id="voiceNote"></span></div></div>

    <div class="box"><h2>Fact-check of the main claims</h2>
      ${(s.claims || []).map(c => `<div class="claim"><span class="st ${esc(c.status)}">${esc(STATUS[c.status] || c.status)}</span>
        <div><div class="c">${esc(c.claim)}</div><div class="w">${esc(c.why)}</div></div></div>`).join("") || `<div class="empty">No claims extracted.</div>`}
      <div class="src" style="margin-top:10px">Judged from headlines across ${s.n_outlets} outlets. "Single source" means nobody else repeats it yet, which proves nothing on its own.</div></div>

    <div class="box"><h2>Watch out</h2><ul>${(s.watch_out || []).map(w => `<li>${esc(w)}</li>`).join("")}</ul></div>

    <div class="box"><h2>Who covered it</h2><div class="cov">
      ${Object.entries(s.by_country).sort((a, b) => b[1] - a[1]).map(([c, n]) => `<div><b>${FLAG[c] || ""} ${esc(CNAME[c] || c)}</b><div class="bar"><i style="width:${n / maxC * 100}%"></i></div>${n}</div>`).join("")}
    </div><div class="src" style="margin-top:10px">Outlets are placed in their country of origin. Google News's China edition mostly shows Western outlets writing in Chinese (BBC, VOA, RFI): we count those under their own country.</div></div>`;
  main.querySelectorAll("[data-showmore]").forEach(b => b.onclick = () => {
    b.closest(".side").querySelectorAll("[data-more]").forEach(x => x.hidden = false); b.remove(); });
  modeSeg.querySelectorAll("button").forEach(b => b.onclick = () => { if (b.dataset.m === "camp" && !campC.length) return alert("No country has outlets rated on two sides for this story."); state.mode = b.dataset.m; render(); });
  if (window.selC) selC.onchange = () => { state.c = selC.value; render(); };
  if (window.selA) selA.onchange = () => { if (selA.value === state.b) state.b = state.a; state.a = selA.value; render(); };
  if (window.selB) selB.onchange = () => { if (selB.value === state.a) state.a = state.b; state.b = selB.value; render(); };
  saveBtn.onclick = () => { state.saved.has(s.id) ? state.saved.delete(s.id) : state.saved.add(s.id); store.set("saved", [...state.saved]); render(); };
  main.querySelectorAll("[data-len]").forEach(b => b.onclick = () => {
    state.len = b.dataset.len; main.querySelectorAll("[data-len]").forEach(x => x.classList.toggle("on", x === b)); regen(s); });
  cmp.onchange = () => { state.cmp = cmp.checked; regen(s); };
  main.querySelectorAll(".listen button[data-l]").forEach(b => b.onclick = () => liveBrief(s, b.dataset.l, b));
  main.querySelector("[data-stop]").onclick = stopSpeech;
}

let audio;
let speakToken = 0;
const LNAME = { en:"English", fr:"French", es:"Spanish", zh:"Simplified Chinese", ar:"Arabic" };
// Changing Short/Long or the compare tick rewrites the text already on screen.
function regen(s) {
  if (!state.liveLang) return;
  liveBrief(s, state.liveLang, main.querySelector(`.listen button[data-l="${state.liveLang}"]`));
}

async function liveBrief(s, l, btn) {
  stopSpeech();
  state.liveLang = l;
  state.lang = l; store.set("lang", l);
  main.querySelectorAll(".listen button[data-l]").forEach(x => x.classList.toggle("on", x === btn));
  const p = document.getElementById("live"), note = document.getElementById("voiceNote");
  p.className = l === "ar" ? "rtl" : ""; p.lang = l;
  p.textContent = "Gemma is writing…"; note.textContent = "";
  let text;
  try {
    const r = await fetch("/api/ask", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ title: s.title, lang: LNAME[l], length: state.len || "long", common_ground: s.common_ground,
        compare: state.cmp ? [CNAME[state.a], CNAME[state.b]] : null,
        sides: s.sides,
        headlines: s.headlines.map(h => ({ country: h.country, outlet: h.outlet, title: h.title, translation: h.translation })) }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.status);
    text = d.text; note.textContent = "Written live by Gemma 4";
  } catch (e) {
    text = (s.briefing || {})[l] || "";
    note.textContent = "Live Gemma unavailable, showing the version prepared earlier";
  }
  p.textContent = text;
  if (text) speak(text, l);
}

function stopSpeech() {
  speakToken++;              // invalidate any in-flight generation
  if (audio) { audio.pause(); audio.currentTime = 0; audio = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();  // belt-and-braces: silence any legacy utterance
}
// ElevenLabs only. No browser/Piper fallback, so a single play can never
// produce two overlapping voices.
async function speak(text, lang) {
  stopSpeech();
  const mine = ++speakToken;               // this call's turn
  const note = document.getElementById("voiceNote");
  note.textContent = "Generating voice…";
  try {
    const r = await fetch("/api/tts", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ text, lang, engine: "elevenlabs" }) });
    const ctype = r.headers.get("content-type") || "";
    if (!r.ok || !ctype.startsWith("audio/")) {
      // Not audio: either the backend isn't deployed (static host) or it errored.
      let msg = ctype.includes("json") ? (await r.json()).error : `HTTP ${r.status}`;
      if (!r.ok && !ctype.includes("json")) msg = "audio needs the live server (this static demo has no /api/tts)";
      throw new Error(msg);
    }
    const blob = await r.blob();
    if (mine !== speakToken) return;        // a newer play started while we waited — drop this one
    audio = new Audio(URL.createObjectURL(blob));
    audio.play();
    note.textContent = "";
  } catch (e) {
    if (mine === speakToken) note.textContent = `Voice unavailable: ${e.message}`;
  }
}

function srcLinks(c) {
  const row = (label, xs) => xs && xs.length ? `<div class="w" style="margin-top:4px"><b>${label}:</b> ${xs.map(x => `<a href="${esc(x.link)}" target="_blank" rel="noopener">${esc(x.outlet)}</a>`).join(" · ")}</div>` : "";
  return row("Published fact-checks", c.fact_checks) + row("Wire agencies", c.wires);
}

function check() {
  main.innerHTML = `<h1>Check a claim</h1>
    <div class="sub">Paste a claim, an article, a WhatsApp message, or an Instagram post link. Gemma pulls the claims and looks for them in other outlets in the US, UK, France and the UAE.</div>
    <div style="max-width:820px;margin-top:18px">
      <textarea id="ctext" placeholder="Paste text here"></textarea>
      <div class="row"><input class="txt" id="curl" placeholder="…or an Instagram post link (optional, uses Apify)" style="flex:1"></div>
      <div class="row"><button class="btn" id="cgo">Check</button><span class="muted" id="cstat"></span></div>
      ${location.hostname === "localhost" || location.hostname === "127.0.0.1" ? "" : `<div class="box" style="margin-top:10px">The live check calls Gemma for about a minute, so it runs in the local version (<code>python3 server.py</code>) and in the Chrome extension. On this hosted demo it may not answer.</div>`}
      <div id="cout"></div>
      <div class="src" style="margin-top:24px">Reading a news site? The Parallax Chrome extension runs the same check on the page you are reading. See the <code>extension</code> folder.</div>
    </div>`;
  cgo.onclick = async () => {
    cgo.disabled = true; cout.innerHTML = ""; cstat.textContent = "Checking, this takes about a minute…";
    try {
      const r = await fetch("/api/check", { method:"POST", headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({ text: ctext.value, instagram: curl.value.trim(), lang: LANGS.find(([l]) => l === state.lang)[1] }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      cout.innerHTML = `${d.source ? `<div class="box"><h2>Source</h2>${esc(d.source)}</div>` : ""}
        <div class="box"><h2>Summary</h2><p style="margin:0;line-height:1.55">${esc(d.summary)}</p></div>
        <div class="box"><h2>Claims</h2>${(d.claims || []).map(c => `<div class="claim"><span class="st ${esc(c.status)}">${esc(STATUS[c.status] || c.status)}</span>
          <div><div class="c">${esc(c.claim)}</div><div class="w">${esc(c.why)}</div>${srcLinks(c)}</div></div>`).join("")}</div>`;
      cstat.textContent = "";
    } catch (e) { cstat.textContent = "Failed: " + e.message + ". This needs the local server (python3 server.py)."; }
    cgo.disabled = false;
  };
}

function method() {
  main.innerHTML = `<h1>How we stay neutral</h1><div class="prose">
    <p><b>Which stories.</b> Every few hours we read this week's headlines from the Google News editions of France, Spain, the US, the UK, China and the UAE. EmbeddingGemma groups headlines about the same event across languages. A story is shown only if outlets from at least 3 countries cover it, and stories are ranked by how many countries and outlets cover them, whether a news agency (Reuters, AP, AFP) does, and how recent they are. Each card says why it is there.</p>
    <p><b>Where an outlet comes from.</b> An outlet counts for its own country, whatever edition it appears in. BBC Chinese counts as UK, Global Times as China.</p>
    <p><b>Who owns it.</b> Every outlet gets the same fields: owner or funder, and whether a government funds it. Left, centre or right appears only where a public rating exists (AllSides, Media Bias Fact Check), which is mostly the US, UK, France and Spain. We never label an outlet reliable or unreliable.</p>
    <p><b>What Gemma does.</b> Gemma 4 reads the headlines and writes what most countries agree on, what each side emphasises or leaves out, and which claims are confirmed, contested or come from a single source. It is told never to say who is right. It only sees headlines, so treat its reading as a starting point.</p>
    <p><b>Limits.</b> Headlines, not full articles. Some countries have few outlets in Google News. Gemma's model has its own blind spots. A claim with no coverage is not false, it is only unconfirmed.</p></div>`;
}

// Older saved comparisons have no flag in front of the country name.
const NAMEFLAG = { "USA":"🇺🇸", "United States":"🇺🇸", "US":"🇺🇸", "UK":"🇬🇧", "United Kingdom":"🇬🇧", "France":"🇫🇷", "Spain":"🇪🇸", "China":"🇨🇳", "UAE":"🇦🇪", "United Arab Emirates":"🇦🇪" };
function addFlag(p) {
  const name = Object.keys(NAMEFLAG).find(n => p.startsWith(n + ":"));
  return name ? `${NAMEFLAG[name]} ${p}` : p;
}

function articleHTML(a, i) {
  const date = new Date(a.saved_at).toLocaleString([], { dateStyle: "medium", timeStyle: "short" });
  const rtl = a.lang === "Arabic" ? ' style="direction:rtl;text-align:right"' : "";
  const head = `<span class="tag">${a.type === "factcheck" ? "Fact-check" : a.type === "compare" ? "Compared across countries" : "Summary"} · ${esc(a.lang)} · ${esc(a.outlet || "")} · ${esc(date)}</span>
    <h3><a href="${esc(a.url)}" target="_blank" rel="noopener" style="text-decoration:none">${esc(a.title || a.page_title)}</a></h3>`;
  const body = a.type === "factcheck"
    ? `<div class="meter">Accuracy estimate <div class="bar"><i style="width:${a.accuracy}%"></i></div> ${a.accuracy}/100</div>
       <div class="why">${esc(a.accuracy_why)}</div>
       <details><summary class="why" style="cursor:pointer">${a.claims.length} claims checked</summary>
       ${a.claims.map(c => `<div class="claim"><span class="st ${esc(c.status)}">${esc(STATUS[c.status] || c.status)}</span>
         <div><div class="c">${esc(c.claim)}</div><div class="w">${esc(c.why)}</div></div></div>`).join("")}
       <div class="w" style="margin-top:6px">${esc(a.outlet_note)}</div></details>`
    : `<div${rtl}><p style="margin:0;font-size:14px;line-height:1.5">${esc(a.summary)}</p>
       <ul style="margin:8px 0 0;padding-left:18px;font-size:13px">${(a.key_points || []).map(p => `<li>${esc(addFlag(p))}</li>`).join("")}</ul></div>`;
  const img = a.image ? `<img src="${esc(a.image)}" alt="" style="width:calc(100% + 36px);margin:-18px -18px 0;height:170px;object-fit:cover;border-radius:14px 14px 0 0" onerror="this.remove()">` : "";
  return `<div class="card" style="cursor:default">${img}${head}${body}
    <div><button class="save" data-del="${i}">Remove</button></div></div>`;
}

function saved() {
  const arts = store.get("articles", []);
  const stories = STORIES.filter(s => state.saved.has(s.id));
  main.innerHTML = `<header class="top"><div><h1>Saved</h1>
      <div class="sub">Articles you summarized or fact-checked with the Parallax extension, and stories you saved here. Kept in this browser.</div></div></header>
    <h2 class="tag" style="margin:0 0 12px">From the extension (${arts.length})</h2>
    <div class="grid">${arts.map(articleHTML).join("") || `<div class="empty">Nothing yet. Open a news article, click the Parallax icon, then Summarize or Fact-check.</div>`}</div>
    <h2 class="tag" style="margin:28px 0 12px">Saved stories (${stories.length})</h2>
    <div class="grid">${stories.map(cardHTML).join("") || `<div class="empty">Open a story and click Save.</div>`}</div>`;
  main.querySelectorAll(".card[data-id]").forEach(c => c.onclick = () => open(c.dataset.id));
  main.querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    const a = store.get("articles", []); a.splice(+b.dataset.del, 1); store.set("articles", a); render(); });
}

function render() {
  renderSidebar();
  if (state.view === "story") story();
  else if (state.view === "check") check();
  else if (state.view === "method") method();
  else if (state.view === "saved") saved();
  else home(STORIES, "This week", "Stories covered in at least 3 countries, ranked by how differently they are told");
  document.querySelectorAll("[data-go]").forEach(el => el.onclick = () => { state.view = el.dataset.go; render(); window.scrollTo(0, 0); });
}

fetch("data/stories.json").then(r => r.json()).then(d => {
  STORIES = d.sort((a, b) => (b.divergence ?? 0) - (a.divergence ?? 0));
  meta.textContent = `${new Set(d.flatMap(s => s.headlines.map(h => h.outlet))).size} outlets compared`;
  let h = location.hash.slice(1);
  if (h.startsWith("save=")) {
    try {
      const item = JSON.parse(decodeURIComponent(escape(atob(h.slice(5)))));
      const arts = store.get("articles", []).filter(a => !(a.url === item.url && a.type === item.type && a.lang === item.lang));
      store.set("articles", [item, ...arts]);
    } catch (e) { console.error("import failed", e); }
    history.replaceState(null, "", "#saved"); h = "saved";
  }
  if (STORIES.some(s => s.id === h)) open(h);
  else { if (["check", "method", "saved"].includes(h)) state.view = h; render(); }
});
</script>
